
<!-- Centro de Preferencias del Auditor (Novu) -->
<div class="mt-8 border-t pt-8">
    <h4 class="text-xl font-bold text-gray-800 mb-4">Centro de Preferencias de Alertas</h4>
    <p class="text-gray-500 text-sm mb-6">Configura cómo y dónde recibes las notificaciones del sistema de auditoría.</p>

    <!-- Alerta de Nuevo Documento -->
    <div class="bg-gray-50 rounded-xl p-5 mb-4">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h5 class="font-bold text-gray-700">FLL_DOCUMENTO_PROCESADO</h5>
                <p class="text-xs text-gray-500">Cuando el OCR extrae un nuevo documento.</p>
            </div>
        </div>
        <div class="flex gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked class="form-checkbox h-4 w-4 text-primary rounded border-gray-300"
                       hx-post="/api/v1/notificaciones/preferencias" hx-vals='{"evento": "FLL_DOCUMENTO_PROCESADO", "canal": "in_app"}' hx-swap="none">
                <span class="text-sm font-medium text-gray-600">In-App</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked class="form-checkbox h-4 w-4 text-primary rounded border-gray-300"
                       hx-post="/api/v1/notificaciones/preferencias" hx-vals='{"evento": "FLL_DOCUMENTO_PROCESADO", "canal": "email"}' hx-swap="none">
                <span class="text-sm font-medium text-gray-600">Correo</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="form-checkbox h-4 w-4 text-primary rounded border-gray-300"
                       hx-post="/api/v1/notificaciones/preferencias" hx-vals='{"evento": "FLL_DOCUMENTO_PROCESADO", "canal": "telegram"}' hx-swap="none">
                <span class="text-sm font-medium text-gray-600">Telegram</span>
            </label>
        </div>
    </div>

    <!-- Alerta de Firma Requerida -->
    <div class="bg-gray-50 rounded-xl p-5">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h5 class="font-bold text-gray-700">FLL_FIRMA_REQUERIDA</h5>
                <p class="text-xs text-gray-500">Asignaciones urgentes y flujos de aprobación.</p>
            </div>
        </div>
        <div class="flex gap-6">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked class="form-checkbox h-4 w-4 text-primary rounded border-gray-300"
                       hx-post="/api/v1/notificaciones/preferencias" hx-vals='{"evento": "FLL_FIRMA_REQUERIDA", "canal": "in_app"}' hx-swap="none">
                <span class="text-sm font-medium text-gray-600">In-App</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked class="form-checkbox h-4 w-4 text-primary rounded border-gray-300"
                       hx-post="/api/v1/notificaciones/preferencias" hx-vals='{"evento": "FLL_FIRMA_REQUERIDA", "canal": "email"}' hx-swap="none">
                <span class="text-sm font-medium text-gray-600">Correo</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked class="form-checkbox h-4 w-4 text-primary rounded border-gray-300"
                       hx-post="/api/v1/notificaciones/preferencias" hx-vals='{"evento": "FLL_FIRMA_REQUERIDA", "canal": "whatsapp"}' hx-swap="none">
                <span class="text-sm font-medium text-gray-600">WhatsApp</span>
            </label>
        </div>
    </div>
</div>
