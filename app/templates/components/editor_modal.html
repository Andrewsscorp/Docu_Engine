<div id="editor-modal-container" x-data="{
    open: false,
    init() {
        this.open = true;
        this.$nextTick(() => {
            document.getElementById('wopi-form').submit();
        });
    },
    closeEditor() {
        this.open = false;
        setTimeout(() => {
            $root.remove();
            window.dispatchEvent(new CustomEvent('editor-closed', {detail: {doc_id: '{{ doc_id }}'}}));
        }, 300);
    }
}"
    x-show="open" 
    x-transition.opacity.duration.300ms
    class="fixed inset-0 flex items-center justify-center bg-black/70 backdrop-blur-sm" style="z-index: 2147483647 !important;">
    
    <div class="bg-white w-[95%] h-[95%] rounded-xl shadow-2xl relative overflow-hidden flex flex-col"
         x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-300"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95">
        
        <!-- Header -->
        <div class="h-12 bg-gray-100 border-b flex justify-between items-center px-4 shrink-0">
            <div class="font-bold text-gray-700 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                Editando Papel de Trabajo: {{ file_name }}
            </div>
            <button @click="closeEditor()" class="p-1 rounded hover:bg-red-100 text-gray-500 hover:text-red-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Content Area -->
        <div class="flex-1 w-full h-full flex flex-row overflow-hidden bg-gray-50">
            <!-- Left: Collabora WOPI IFrame -->
            <div class="flex-1 h-full shadow-inner border-r border-gray-200 relative bg-white">
                <form id="wopi-form" action="{{ collabora_url }}" target="collabora-iframe" method="POST" class="hidden">
                    <input type="hidden" name="access_token" value="{{ access_token }}">
                    <input type="hidden" name="access_token_ttl" value="0">
                </form>
                <iframe id="collabora-iframe" name="collabora-iframe" class="w-full h-full border-0" allow="fullscreen"></iframe>
            </div>
            
            <!-- Right: Future Options Panel (Reserved Space) -->
            <div class="w-[600px] bg-white h-full flex flex-col p-6 shadow-sm z-10 shrink-0 hidden md:flex">
                <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-4">Opciones del Documento</h3>
                <div class="border-2 border-dashed border-gray-300 rounded-xl h-full flex items-center justify-center bg-gray-50/50">
                    <div class="text-center p-4">
                        <svg class="w-10 h-10 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        <p class="text-gray-400 font-medium text-sm">Espacio en blanco reservado para futuras opciones y herramientas</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
