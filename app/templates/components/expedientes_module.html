<div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
    
    <!-- Header Controls -->
    <div class="flex justify-between items-center mb-6 z-10 flex-shrink-0">
        <div class="relative w-full max-w-md">
            <input type="text" id="expedientes-search-input" name="q" placeholder="Buscar expedientes por código o nombre..." 
                   class="w-full pl-12 pr-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all card-shadow bg-white text-gray-700 placeholder-gray-400"
                   hx-get="/api/v1/agn/expedientes/module"
                   hx-trigger="keyup changed delay:500ms, search"
                   hx-target="#expedientes-results-grid"
                   hx-include="[name='status']"
                   value="{{ q }}"
                   autocomplete="off">
            <svg class="w-6 h-6 absolute left-4 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <div class="flex gap-3">
            <select name="status" class="bg-white border border-gray-200 text-gray-700 text-sm font-medium rounded-xl focus:ring-primary focus:border-primary block p-2.5 card-shadow"
                    hx-get="/api/v1/agn/expedientes/module"
                    hx-trigger="change"
                    hx-target="#expedientes-results-grid"
                    hx-include="[name='q']">
                <option value="" {% if not status %}selected{% endif %}>Todos los Estados</option>
                <option value="abierto" {% if status == 'abierto' %}selected{% endif %}>Abierto</option>
                <option value="cerrado" {% if status == 'cerrado' %}selected{% endif %}>Cerrado</option>
            </select>
            
            <button type="button" onclick="window.openAgnModal()" class="bg-primary hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-lg shadow-primary/30 flex items-center gap-2 z-20 hover:scale-105 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Nuevo Expediente
            </button>
        </div>
    </div>

    <!-- Results Grid -->
    <div id="expedientes-results-grid">
        {% include 'components/expedientes_grid.html' %}
    </div>
</div>
