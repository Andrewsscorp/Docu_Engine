<div x-data="{ vista: 'cuadricula', drawerAbierto: false, currentDocId: null, typeFilter: '', dateFilter: '', statusFilter: '', activeFolder: '' }" class="h-full flex flex-col">
    
<div class="flex gap-6 h-full w-full">
    <!-- TRD Tree Panel (Left) -->
    <div class="w-[300px] bg-white rounded-2xl shadow-sm border border-gray-100 p-4 shrink-0 flex flex-col h-full" hx-get="/api/v1/agn/tree_html" hx-trigger="load">
        <div class="flex flex-col items-center justify-center h-full text-gray-400 gap-3">
            <svg class="animate-spin h-8 w-8 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-sm font-medium">Cargando TRD...</span>
        </div>
    </div>

    <!-- Main Documents Panel (Right) -->
    <div class="flex-1 min-w-0 flex flex-col h-full overflow-hidden">

    <!-- Hidden inputs for filters -->
    <input type="hidden" name="agn_expediente_id" id="agn_expediente_id" value="{{ agn_expediente_id }}">

    <input type="hidden" name="type_filter" x-model="typeFilter">
    <input type="hidden" name="date_filter" x-model="dateFilter">
    <input type="hidden" name="status" x-model="statusFilter">
    <input type="hidden" name="folder_filter" x-model="activeFolder">

    <!-- Quick Filters -->
    <section class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex flex-wrap items-center gap-4 mb-6">
      <div class="flex flex-wrap gap-2 border-r border-gray-200 pr-4">
        <button @click="typeFilter = ''; document.querySelector('input[name=type_filter]').value = ''; htmx.trigger('#explorer-search-input', 'search')" :class="typeFilter === '' ? 'bg-primary text-white shadow-sm' : 'text-gray-600 hover:bg-gray-50'" class="px-4 py-2 rounded-lg font-medium text-sm transition-colors">Todos</button>
        <button @click="typeFilter = 'pdf'; document.querySelector('input[name=type_filter]').value = 'pdf'; htmx.trigger('#explorer-search-input', 'search')" :class="typeFilter === 'pdf' ? 'bg-primary text-white shadow-sm' : 'text-gray-600 hover:bg-gray-50'" class="px-4 py-2 rounded-lg font-medium text-sm transition-colors">PDFs</button>
        <button @click="typeFilter = 'images'; document.querySelector('input[name=type_filter]').value = 'images'; htmx.trigger('#explorer-search-input', 'search')" :class="typeFilter === 'images' ? 'bg-primary text-white shadow-sm' : 'text-gray-600 hover:bg-gray-50'" class="px-4 py-2 rounded-lg font-medium text-sm transition-colors">Imágenes</button>
      </div>
      <div class="flex flex-1 flex-wrap gap-3 items-center">
        <div class="relative">
          <select x-model="dateFilter" @change="htmx.trigger('#explorer-search-input', 'search')" class="appearance-none bg-gray-50 border border-gray-200 rounded-lg py-2 pl-3 pr-10 text-sm text-gray-700 focus:outline-none focus:border-primary">
            <option value="{{ agn_expediente_id }}">Cualquier fecha</option>
            <option value="week">Última semana</option>
            <option value="month">Este mes</option>
            <option value="year">Este año</option>
          </select>
          <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <div class="relative">
          <select x-model="statusFilter" @change="htmx.trigger('#explorer-search-input', 'search')" class="appearance-none bg-gray-50 border border-gray-200 rounded-lg py-2 pl-3 pr-10 text-sm text-gray-700 focus:outline-none focus:border-primary">
            <option value="{{ agn_expediente_id }}">Todos los estados</option>
            <option value="COMPLETED">Listo</option>
            <option value="PENDING">Pendiente</option>
          </select>
          <svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
        </div>
        
        <!-- Create Folder Button (Red) -->
        
          <!-- UPLOAD TRD FORM -->
          <form id="form-upload-trd" hx-encoding="multipart/form-data" hx-post="/api/v1/documents/upload-initial" hx-trigger="submit" hx-target="#modal-container" hx-swap="innerHTML" class="hidden">
              <input type="file" name="archivo" id="archivo-upload-trd" accept=".pdf,.docx,.jpg,.png" onchange="htmx.trigger('#form-upload-trd', 'submit')">
              <input type="hidden" name="agn_expediente_id" id="upload_agn_expediente_id" value="">
          </form>

          <button onclick="let exp = document.getElementById('agn_expediente_id').value; if(!exp) { Swal.fire('Error', 'Selecciona un Expediente en el arbol de la izquierda primero.', 'warning'); return; } document.getElementById('upload_agn_expediente_id').value = exp; document.getElementById('archivo-upload-trd').click();" class="ml-2 flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2 px-4 rounded-lg transition-colors shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            Subir Documento
          </button>

          <button onclick="window.openAgnModal()" class="ml-2 flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm py-2 px-4 rounded-lg transition-colors shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Nuevo Expediente TRD
          </button>
<button @click="createFolder()" class="ml-auto flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-medium text-sm py-2 px-4 rounded-lg transition-colors shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          Nueva Carpeta
        </button>
      </div>
    </section>
    
    <!-- Folders Section -->
    <section class="mb-8" x-data="{ dragHover: null }">
        <div class="flex justify-between items-end mb-4">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-6 border-b border-gray-200">
                    <h2 class="text-xl font-bold pb-2 border-b-2 border-primary text-primary">Carpetas</h2>
                    
                </div>
                <button x-show="activeFolder !== ''" @click="activeFolder = ''; document.querySelector('input[name=folder_filter]').value = ''; htmx.trigger('#explorer-search-input', 'search')" class="flex items-center gap-1 px-3 py-1 bg-red-50 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100 transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Volver a todos
                </button>
            </div>
            <button class="text-primary font-medium hover:underline text-sm">Ver todo</button>
        </div>
        
        <div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            {% for folder in folders %}
            <div class="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm hover:shadow-md transition-all cursor-pointer flex items-center gap-4 group"
                 
                 @click="activeFolder = '{{ folder.id }}'; document.querySelector('input[name=folder_filter]').value = '{{ folder.id }}'; htmx.trigger('#explorer-search-input', 'search')"
                 :class="activeFolder === '{{ folder.id }}' ? 'ring-2 ring-primary border-primary bg-primary/5' : (dragHover === '{{ folder.id }}' ? 'border-primary ring-2 ring-primary/20 bg-primary/5 scale-105' : '')"
                 @dragover.prevent="dragHover = '{{ folder.id }}'"
                 @dragleave.prevent="dragHover = null"
                 @drop.prevent="dragHover = null; moveDoc(event.dataTransfer.getData('text/plain'), '{{ folder.id }}')">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform" style="background-color: {{ folder.color }}20; color: {{ folder.color }};">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                </div>
                <div>
                    <h4 class="font-bold text-gray-800">{{ folder.name }}</h4>
                    <p class="text-xs text-gray-500 mt-0.5">{{ folder.doc_count }} Archivos</p>
                </div>
            </div>
            {% endfor %}
            {% if not folders %}
            <div class="col-span-full py-8 text-center text-gray-400 text-sm border-2 border-dashed border-gray-200 rounded-2xl">
                Aún no tienes carpetas. Haz clic en "Nueva Carpeta" para crear una.
            </div>
            {% endif %}
            </div>
        </div>
        
        
    </section>

    

    <!-- Header Controls -->
    <div class="flex justify-between items-center mb-6 z-10 flex-shrink-0">
        <div class="relative w-full max-w-md">
            <input type="text" id="explorer-search-input" name="q" placeholder="Buscar documentos por tÃ­tulo o contenido OCR..." 
                   class="w-full pl-12 pr-4 py-3 rounded-2xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all card-shadow bg-white text-gray-700 placeholder-gray-400"
                   hx-get="/api/v1/documents/explorer"
                   hx-trigger="keyup changed delay:500ms, search"
                   hx-target="#explorer-results"
                   hx-include="[name='sort'], [name='view'], [name='group_id'], [name='status'], [name='type_filter'], [name='date_filter'], [name='folder_filter'], #agn_expediente_id"
                   value="{{ q }}"
                   autocomplete="off">
            <svg class="w-6 h-6 absolute left-4 top-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="flex bg-gray-100 rounded-lg p-1">
                <button @click="vista = 'cuadricula'" :class="vista === 'cuadricula' ? 'bg-white shadow-sm text-primary' : 'text-gray-500'" class="px-3 py-1.5 rounded-md text-sm font-medium transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                </button>
                <button @click="vista = 'lista'" :class="vista === 'lista' ? 'bg-white shadow-sm text-primary' : 'text-gray-500'" class="px-3 py-1.5 rounded-md text-sm font-medium transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
            
            <select name="sort" class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-sm text-gray-700 focus:outline-none focus:border-primary shadow-sm" hx-get="/api/v1/documents/explorer" hx-target="#explorer-results" hx-include="[name='q'], [name='view'], [name='group_id'], [name='status'], [name='type_filter'], [name='date_filter'], [name='folder_filter'], #agn_expediente_id">
                <option value="desc" {% if sort == 'desc' %}selected{% endif %}>MÃ¡s recientes</option>
                <option value="asc" {% if sort == 'asc' %}selected{% endif %}>MÃ¡s antiguos</option>
            </select>
        </div>
    </div>
    
    {% include "components/explorer_results.html" %}
    <!-- Drawer Overlay & Container -->
    <div x-show="drawerAbierto" x-cloak 
         @click.outside="drawerAbierto = false"
         class="fixed inset-y-0 right-0 bg-white w-full max-w-lg shadow-[rgba(0,0,0,0.1)_0px_0px_50px_0px] h-full flex flex-col z-[100]" 
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200 transform"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full">
        
        <!-- Close Button -->
        <button @click="drawerAbierto = false" class="absolute top-4 left-4 p-2 bg-white/80 backdrop-blur rounded-full text-gray-500 hover:text-gray-800 shadow-sm z-20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
            
            <!-- HTMX Drawer Content Area -->
            <div id="drawer-content" class="h-full w-full overflow-y-auto" @open-drawer.window="htmx.ajax('GET', '/api/v1/documents/' + $event.detail + '/drawer', {target: '#drawer-content'})" @editor-closed.window="htmx.ajax('GET', '/api/v1/documents/' + $event.detail.doc_id + '/drawer', {target: '#drawer-content'})">
                <div class="flex justify-center items-center h-full">
                    <div class="loader-spinner"></div>
                </div>
            </div>
        </div>
    </div>
</div>


    <!-- JS Helper Functions -->
    <script>
        const availableFolders = [
            {% for folder in folders %}
            { id: '{{ folder.id }}', name: '{{ folder.name }}', color: '{{ folder.color }}' },
            {% endfor %}
        ];
        
        window.openMoveModal = function(docId) {
            if (availableFolders.length === 0) {
                Swal.fire('Sin carpetas', 'Crea primero una carpeta para poder mover documentos.', 'info');
                return;
            }
            
            let optionsHtml = '<div class="flex flex-col gap-2 mt-4 text-left">';
            availableFolders.forEach(f => {
                optionsHtml += `
                    <button onclick="Swal.close(); window.moveDoc('${docId}', '${f.id}')" class="w-full px-4 py-3 border border-gray-200 rounded-xl hover:bg-gray-50 flex items-center gap-3 transition-colors text-left">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background-color: ${f.color}20; color: ${f.color};">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                        </div>
                        <span class="font-bold text-gray-700 font-sans">${f.name}</span>
                    </button>
                `;
            });
            optionsHtml += '</div>';
            
            Swal.fire({
                title: 'Mover a carpeta',
                html: optionsHtml,
                showConfirmButton: false,
                showCloseButton: true,
                customClass: {
                    popup: 'rounded-2xl font-sans'
                }
            });
        }

        // Variable global para almacenar el color seleccionado en el popup
        window.selectedFolderColor = '#4648d4'; // Azul por defecto

        window.selectColor = function(colorHex, element) {
            window.selectedFolderColor = colorHex;
            // Remover estilos de seleccionado de todos los circulos
            document.querySelectorAll('.color-circle').forEach(el => {
                el.classList.remove('ring-4', 'ring-offset-2', 'ring-gray-200');
                el.innerHTML = '';
            });
            // Agregar estilo de seleccionado al circulo actual
            element.classList.add('ring-4', 'ring-offset-2', 'ring-gray-200');
            element.innerHTML = '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
        }

        
          
          
            
            
            window.openCrearSerieModal = function() {
                const fondoSelect = document.getElementById('fondo_select');
                const fondoId = fondoSelect ? fondoSelect.value : null;
                const seccionSelect = document.getElementById('seccion_select');
                const seccionId = seccionSelect ? seccionSelect.value : null;
                const subseccionSelect = document.getElementById('subseccion_select');
                const subseccionId = subseccionSelect ? subseccionSelect.value : '';
                
                if (!fondoId || !seccionId) {
                    Swal.fire('Atención', 'Debe seleccionar obligatoriamente un Fondo y una Sección Padre primero.', 'warning');
                    return;
                }
                
                Swal.fire({
                    width: '800px',
                    padding: 0,
                    showConfirmButton: false,
                    customClass: { popup: 'rounded-2xl' },
                    didOpen: () => {
                        Swal.showLoading();
                        fetch(`/api/v1/agn/modal/serie?fondo_id=${fondoId}&seccion_id=${seccionId}&subseccion_id=${subseccionId}`)
                            .then(r => r.text())
                            .then(html => {
                                Swal.getPopup().innerHTML = html;
                                if (window.htmx) { htmx.process(Swal.getPopup()); }
                                if (window.Alpine) { Alpine.initTree(Swal.getPopup()); }
                            });
                    }
                });
            };

            
            window.openCrearSubserieModal = function() {
                const fondoSelect = document.getElementById('fondo_select');
                const fondoId = fondoSelect ? fondoSelect.value : null;
                const seccionSelect = document.getElementById('seccion_select');
                const seccionId = seccionSelect ? seccionSelect.value : null;
                const subseccionSelect = document.getElementById('subseccion_select');
                const subseccionId = subseccionSelect ? subseccionSelect.value : '';
                const serieSelect = document.getElementById('serie_select');
                const serieId = serieSelect ? serieSelect.value : null;
                
                if (!fondoId || !seccionId || !serieId) {
                    Swal.fire('Atención', 'Debe seleccionar obligatoriamente un Fondo, una Sección y una Serie Padre primero.', 'warning');
                    return;
                }
                
                Swal.fire({
                    width: '800px',
                    padding: 0,
                    showConfirmButton: false,
                    customClass: { popup: 'rounded-2xl' },
                    didOpen: () => {
                        Swal.showLoading();
                        fetch(`/api/v1/agn/modal/subserie?fondo_id=${fondoId}&seccion_id=${seccionId}&subseccion_id=${subseccionId}&serie_id=${serieId}`)
                            .then(r => r.text())
                            .then(html => {
                                Swal.getPopup().innerHTML = html;
                                if (window.htmx) { htmx.process(Swal.getPopup()); }
                                if (window.Alpine) { Alpine.initTree(Swal.getPopup()); }
                            });
                    }
                });
            };

            window.openCrearSubseccionModal = function() {
                const fondoSelect = document.getElementById('fondo_select');
                const fondoId = fondoSelect ? fondoSelect.value : null;
                const seccionSelect = document.getElementById('seccion_select');
                const seccionId = seccionSelect ? seccionSelect.value : null;
                
                if (!fondoId || !seccionId) {
                    Swal.fire('Atención', 'Debe seleccionar un Fondo y una Sección Padre primero.', 'warning');
                    return;
                }
                Swal.fire({
                    width: '700px',
                    padding: 0,
                    showConfirmButton: false,
                    customClass: { popup: 'rounded-2xl' },
                    didOpen: () => {
                        Swal.showLoading();
                        fetch('/api/v1/agn/modal/subseccion?fondo_id=' + fondoId + '&seccion_id=' + seccionId)
                            .then(r => r.text())
                            .then(html => {
                                Swal.getPopup().innerHTML = html;
                                if (window.htmx) { htmx.process(Swal.getPopup()); }
                                if (window.Alpine) { Alpine.initTree(Swal.getPopup()); }
                            });
                    }
                });
            };

            window.openCrearSeccionModal = function() {
                const fondoSelect = document.getElementById('fondo_select');
                const fondoId = fondoSelect ? fondoSelect.value : null;
                if (!fondoId) {
                    Swal.fire('Atención', 'Debe crear y seleccionar un Fondo Documental Padre primero.', 'warning');
                    return;
                }
                Swal.fire({
                    width: '600px',
                    padding: 0,
                    showConfirmButton: false,
                    customClass: { popup: 'rounded-2xl' },
                    didOpen: () => {
                        Swal.showLoading();
                        fetch('/api/v1/agn/modal/seccion?fondo_id=' + fondoId)
                            .then(r => r.text())
                            .then(html => {
                                Swal.getPopup().innerHTML = html;
                                if (window.htmx) { htmx.process(Swal.getPopup()); }
                                if (window.Alpine) { Alpine.initTree(Swal.getPopup()); }
                            });
                    }
                });
            };

            window.openCrearFondoModal = function() {
              Swal.fire({
                  width: '600px',
                  padding: 0,
                  showConfirmButton: false,
                  customClass: { popup: 'rounded-2xl' },
                  didOpen: () => {
                      Swal.showLoading();
                      fetch('/api/v1/agn/modal/fondo')
                          .then(r => r.text())
                          .then(html => {
                              Swal.getPopup().innerHTML = html;
                                if (window.htmx) { htmx.process(Swal.getPopup()); }
                                if (window.Alpine) { Alpine.initTree(Swal.getPopup()); }
                          });
                  }
              });
          };

          window.openAgnModal = function() {
              Swal.fire({
                  width: '800px',
                  padding: 0,
                  showConfirmButton: false,
                  customClass: { popup: 'rounded-2xl' },
                  didOpen: () => {
                      Swal.showLoading();
                      fetch('/api/v1/agn/modal')
                          .then(r => r.text())
                          .then(html => {
                              Swal.getPopup().innerHTML = html;
                                if (window.htmx) { htmx.process(Swal.getPopup()); }
                                if (window.Alpine) { Alpine.initTree(Swal.getPopup()); }
                          });
                  }
              });
          };

          window.submitAgnExpediente = function() {
                const form = document.getElementById('agn-expediente-form');
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                
                const formData = new FormData(form);
                Swal.showLoading();
                fetch('/api/v1/agn/expedientes', { 
                    method: 'POST',
                    body: formData
                })
                .then(r => r.json().then(data => ({status: r.status, data})))
                .then(({status, data}) => {
                    if (status === 200 || status === 201 || data.status === 'success') {
                        Swal.fire({
                            title: '¡Expediente Creado!',

        window.submitCreateFolder = function() {
            const nameInput = document.getElementById('swal-input-name');
            if(!nameInput.value.trim()) {
                nameInput.focus();
                nameInput.classList.add('border-red-500');
                return;
            }
            
            let formData = new FormData();
            formData.append('name', nameInput.value.trim());
            formData.append('color', window.selectedFolderColor);
            
            Swal.showLoading();
            
            fetch('/api/v1/folders', {
                method: 'POST',
                body: formData
            }).then(res => res.json()).then(data => {
                if(data.status === 'success') {
                    htmx.trigger('body', 'reloadExplorer');
                    Swal.fire({toast: true, position: 'top-end', icon: 'success', title: 'Carpeta creada', showConfirmButton: false, timer: 2000});
                } else {
                    Swal.fire('Error', data.message || 'No se pudo crear la carpeta', 'error');
                }
            }).catch(err => {
                Swal.fire('Error', 'Hubo un problema de conexión', 'error');
            });
        }
        
        window.moveDoc = function(docId, folderId) {
            if(!docId) return;
            let formData = new FormData();
            formData.append('folder_id', folderId);
            
            fetch('/api/v1/documentos/' + docId + '/mover', {
                method: 'POST',
                body: formData
            }).then(res => {
                if(res.ok) {
                    htmx.trigger('body', 'reloadExplorer');
                    Swal.fire({toast: true, position: 'top-end', icon: 'success', title: 'Documento movido a carpeta', showConfirmButton: false, timer: 2000});
                }
            });
        }
