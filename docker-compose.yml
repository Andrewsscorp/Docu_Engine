version: '3.8'

services:
  db:
    image: postgres:15
    container_name: docuengine_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superadmin_password
      POSTGRES_DB: docuengine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  ocr_worker:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    container_name: docuengine_ocr_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:superadmin_password@db:5432/docuengine
    depends_on:
      - db
    restart: unless-stopped

  document_server:
    image: onlyoffice/documentserver:latest
    container_name: docuengine-document-server
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=docuengine_super_secret_jwt_onlyoffice_key
      - JWT_HEADER=Authorization
    ports:
      - "8080:80"
    restart: unless-stopped

  collabora:
    build:
      context: .
      dockerfile: Dockerfile.collabora
    container_name: docuengine-collabora
    environment:
      - aliasgroup1=http://host.docker.internal:8555
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false
    ports:
      - "9980:9980"
    restart: unless-stopped

volumes:
  postgres_data:
